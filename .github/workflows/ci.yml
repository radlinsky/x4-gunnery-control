name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 libxml2-utils shellcheck zip ripgrep
      - run: ./scripts/validate.sh
      - run: ./scripts/package.sh
      - run: ./scripts/package-testlab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: x4-gunnery-control
          path: dist/*.zip
